<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פנקס פעולות</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#a63d63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פנקס פעולות">
<style>
:root{--bg:#fbf5f6;--card:#fff;--ink:#2b1f24;--mute:#8a7780;--line:#eedfe4;--accent:#a63d63;--soft:#f6dfe6;--ok:#2e7d5b;--part:#c98a2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:0 14px 90px}
header{padding:18px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;margin:0}
h2{font-size:14px;color:var(--mute);margin:22px 2px 8px;font-weight:600}
#total{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px}
.cat:active{transform:scale(.98)}
.cat .n{font-size:13px;font-weight:600;line-height:1.25;flex:1}
.cat .c{font-size:24px;font-weight:700}.cat .c small{font-size:14px;color:var(--mute);font-weight:500}
.cat.done{border-color:var(--ok)}.cat.done .c{color:var(--ok)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.bar i{background:var(--accent)}.bar b{background:var(--part)}
.split{font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:3px}
.e{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:block;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer}
.e .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.e .s{font-size:13px;color:var(--mute);margin-top:2px}
.tag{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;white-space:nowrap;align-self:start}
.tag.led{background:var(--soft);color:var(--accent)}.tag.part{background:#f7ead2;color:#8a5a10}
.empty{color:var(--mute);text-align:center;padding:24px 0;font-size:14px}
footer{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
button.p,button.g{font:inherit;border-radius:12px;padding:13px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;flex:1}
button.danger{color:#b3261e}
dialog{border:0;border-radius:18px;padding:18px;width:min(94vw,440px);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(43,31,36,.45)}
dialog h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;text-align:center;padding:13px;border:1px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details{margin-top:12px}summary{color:var(--accent);font-size:14px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:16px}.row .p{flex:1}
.stack{display:flex;flex-direction:column;gap:8px}
.note{font-size:13px;color:var(--mute);margin:0 0 12px}
#msg{font-size:13px;color:var(--accent);min-height:18px;margin-top:8px}
</style>
</head>
<body>
<header><h1>פנקס פעולות</h1><span id="total"></span></header>
<h2>מיילדות · לחיצה על כרטיס מוסיפה פעולה</h2>
<div class="grid" id="cats"></div>
<h2>פעולות אחרונות</h2>
<div id="list"></div>

<footer>
  <button class="p" id="addBtn">+ פעולה חדשה</button>
  <button class="g" id="bkBtn">גיבוי</button>
</footer>

<dialog id="dlg">
  <form id="f">
    <h3 id="dlgTitle">פעולה חדשה</h3>
    <button class="g" type="button" id="scanBtn" style="width:100%">📷 צילום מדבקת מטופלת</button>
    <input type="file" id="scanFile" accept="image/*" hidden>
    <div id="scanMsg" class="note" style="margin:6px 0 0"></div>
    <label for="cat">סוג פעולה</label>
    <select id="cat" required></select>
    <label>התפקיד שלי</label>
    <div class="seg">
      <label style="margin:0"><input type="radio" name="role" value="led" required><span>הובלתי</span></label>
      <label style="margin:0"><input type="radio" name="role" value="part"><span>השתתפתי</span></label>
    </div>
    <div class="two">
      <div><label for="date">תאריך</label><input id="date" type="date" required></div>
      <div><label for="patient">שם המטופלת</label><input id="patient" autocomplete="off"></div>
    </div>
    <label for="att">רופא/ה בכיר/ה</label>
    <input id="att" list="atts" autocomplete="off"><datalist id="atts"></datalist>
    <details id="more"><summary>עוד פרטים (ת"ז, שעות, הערה)</summary>
      <label for="pid">ת"ז מטופלת</label><input id="pid" inputmode="numeric" autocomplete="off">
      <div class="two">
        <div><label for="tIn">כניסה לחדר ניתוח</label><input id="tIn" type="time"></div>
        <div><label for="tStart">התחלת ניתוח</label><input id="tStart" type="time"></div>
      </div>
      <label for="note">הערה</label><textarea id="note" rows="2"></textarea>
    </details>
    <div class="row">
      <button class="p" type="submit">שמירה</button>
      <button class="g danger" type="button" id="delBtn" hidden>מחיקה</button>
      <button class="g" type="button" id="cancelBtn">ביטול</button>
    </div>
  </form>
</dialog>

<dialog id="bk">
  <h3>גיבוי וייצוא</h3>
  <p class="note">המידע שמור רק בטלפון הזה. פעם ביום, בשמירת הפעולה הראשונה, נשמר אוטומטית קובץ גיבוי בתיקיית ההורדות. לפני החלפת טלפון יש להעתיק את הקובץ האחרון למקום אחר.</p>
  <div class="stack">
    <button class="p" id="expJson">שמירת קובץ גיבוי</button>
    <button class="g" id="expDrive">גיבוי מוצפן ל-Drive</button>
    <button class="g" id="expCsv">ייצוא טבלה (Excel / CSV)</button>
    <button class="g" id="impBtn">שחזור מקובץ גיבוי</button>
    <input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden>
    <button class="g" id="bkClose">סגירה</button>
  </div>
  <div id="msg"></div>
</dialog>

<script>
const CATS = [
  {id:'1.1',   name:'קבלת לידות רגילות', req:50},
  {id:'1.2',   name:'קבלת לידות תאומים', req:5},
  {id:'1.3',   name:'לידות מכשירניות', req:10},
  {id:'1.4',   name:'ביקורת רחם ו/או תעלת לידה', req:10},
  {id:'1.5.1', name:'ניתוח קיסרי ראשון', req:25},
  {id:'1.5.2', name:'ניתוח קיסרי חוזר', req:25},
];
const KEY = 'logbook.v1', BKD = 'logbook.backupDate', DRV = 'logbook.driveDate', PW = 'logbook.backupPw';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const heDate = d => d.split('-').reverse().join('.');
const ROLE = {led:'הובלתי', part:'השתתפתי'};

let entries = [], editing = null;
try { entries = JSON.parse(localStorage.getItem(KEY)) || []; } catch { entries = []; }
navigator.storage?.persist?.();
navigator.serviceWorker?.register('sw.js').catch(() => {}); // offline support // ask the browser not to evict our data

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(entries)); return true; }
  catch (e) { alert('השמירה נכשלה: ' + e.message); return false; }
}

// Pure: per-category counts of led / participated.
function summarize(list) {
  const s = Object.fromEntries(CATS.map(c => [c.id, {led:0, part:0}]));
  for (const e of list) if (s[e.cat]) s[e.cat][e.role === 'led' ? 'led' : 'part']++;
  return s;
}

function render() {
  const s = summarize(entries);
  const bd = localStorage.getItem(BKD);
  $('total').textContent = entries.length + ' פעולות · גיבוי: ' + (bd ? (bd === today() ? 'היום' : heDate(bd)) : 'עוד לא');
  const dd = localStorage.getItem(DRV);
  $('bkBtn').textContent = dd && dd !== today() && entries.length ? 'גיבוי ●' : 'גיבוי'; // dot = Drive copy is older than today
  $('cats').innerHTML = CATS.map(c => {
    const {led, part} = s[c.id], n = led + part, pct = x => Math.min(100, x / c.req * 100);
    return `<button class="cat ${n >= c.req ? 'done' : ''}" data-cat="${c.id}">
      <span class="n">${esc(c.name)}</span>
      <span class="c">${n}<small> / ${c.req}${n >= c.req ? ' ✓' : ''}</small></span>
      <span class="bar"><i style="width:${pct(led)}%"></i><b style="width:${Math.min(100 - pct(led), pct(part))}%"></b></span>
      <span class="split"><span class="dot" style="background:var(--accent)"></span>הובלתי ${led} · <span class="dot" style="background:var(--part)"></span>השתתפתי ${part}</span>
    </button>`;
  }).join('');
  const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $('list').innerHTML = sorted.length ? sorted.map(e => {
    const c = CATS.find(c => c.id === e.cat);
    const sub = [heDate(e.date), e.patient, e.attending, e.tStart && 'התחלה ' + e.tStart].filter(Boolean).map(esc).join(' · ');
    return `<button class="e" data-id="${e.id}"><span class="t"><span>${esc(c ? c.name : e.cat)}</span><span class="tag ${e.role}">${ROLE[e.role]}</span></span>
      <span class="s">${sub}</span>${e.note ? `<span class="s">${esc(e.note)}</span>` : ''}</button>`;
  }).join('') : '<div class="empty">עדיין אין פעולות. לחצי על כרטיס כדי להוסיף את הראשונה.</div>';
  $('atts').innerHTML = [...new Set(entries.map(e => e.attending).filter(Boolean))].map(a => `<option value="${esc(a)}">`).join('');
}

function openForm(e, catId) {
  editing = e || null;
  $('dlgTitle').textContent = e ? 'עריכת פעולה' : 'פעולה חדשה';
  $('delBtn').hidden = !e;
  $('cat').value = e ? e.cat : (catId || '');
  for (const r of $('f').role) r.checked = e ? r.value === e.role : false;
  $('date').value = e ? e.date : today();
  $('patient').value = e?.patient || '';
  $('att').value = e ? e.attending || '' : (localStorage.getItem('logbook.lastAtt') || '');
  $('tIn').value = e?.tIn || ''; $('tStart').value = e?.tStart || ''; $('note').value = e?.note || '';
  $('pid').value = e?.pid || ''; $('scanMsg').textContent = '';
  $('more').open = !!(e && (e.pid || e.tIn || e.tStart || e.note));
  $('dlg').showModal();
}

$('cat').innerHTML = '<option value="" disabled selected>בחרי…</option>' + CATS.map(c => `<option value="${c.id}">${c.id} · ${esc(c.name)}</option>`).join('');
$('cats').onclick = ev => { const b = ev.target.closest('.cat'); if (b) openForm(null, b.dataset.cat); };
$('list').onclick = ev => { const b = ev.target.closest('.e'); if (b) openForm(entries.find(e => e.id == b.dataset.id)); };
$('addBtn').onclick = () => openForm();
$('cancelBtn').onclick = () => $('dlg').close();
$('delBtn').onclick = () => {
  if (!confirm('למחוק את הפעולה?')) return;
  entries = entries.filter(e => e !== editing); if (save()) { $('dlg').close(); autoBackup(); render(); }
};
$('f').onsubmit = ev => {
  ev.preventDefault();
  const data = {cat:$('cat').value, role:$('f').role.value, date:$('date').value, patient:$('patient').value.trim(),
    attending:$('att').value.trim(), pid:$('pid').value.trim(), tIn:$('tIn').value, tStart:$('tStart').value, note:$('note').value.trim()};
  if (editing) Object.assign(editing, data); else entries.push({id: Date.now(), ...data});
  if (data.attending) localStorage.setItem('logbook.lastAtt', data.attending);
  if (save()) { $('dlg').close(); autoBackup(); render(); }
};

// Backup
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('bkBtn').onclick = () => { $('msg').textContent = ''; $('bk').showModal(); };
$('bkClose').onclick = () => $('bk').close();
function backup() {
  download(`logbook-${today()}.json`, JSON.stringify(entries, null, 1), 'application/json');
  localStorage.setItem(BKD, today());
}
// Daily local backup: the first change of each day also drops a backup file into the phone's Downloads.
// ponytail: runs on save (needs a user tap to be allowed to download), not on a timer; one small file per active day.
const autoBackup = () => { if (entries.length && localStorage.getItem(BKD) !== today()) backup(); };
$('expJson').onclick = () => { backup(); render(); $('msg').textContent = 'קובץ הגיבוי נשמר בהורדות.'; };
// Encrypted off-phone copy: AES-GCM with a key derived from her password, so Drive only ever holds ciphertext.
const b64 = buf => { let t = ''; for (const b of new Uint8Array(buf)) t += String.fromCharCode(b); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function keyFrom(pw, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function encrypt(text, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await keyFrom(pw, salt), new TextEncoder().encode(text));
  return JSON.stringify({logbook:1, salt:b64(salt), iv:b64(iv), data:b64(data)});
}
async function decrypt(o, pw) {
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, await keyFrom(pw, unb64(o.salt)), unb64(o.data)));
}
$('expDrive').onclick = async () => {
  const m = $('msg'); let pw = localStorage.getItem(PW);
  if (!pw) { // separate tap from the share itself: the share sheet only opens right after a tap
    pw = prompt('בחרי סיסמה לגיבוי (6 תווים לפחות). בלי הסיסמה לא ניתן לשחזר את הגיבוי, אז כתבי אותה במקום בטוח.');
    if (!pw) return;
    if (pw.length < 6) { m.textContent = 'הסיסמה קצרה מדי.'; return; }
    localStorage.setItem(PW, pw); m.textContent = 'הסיסמה נשמרה. לחצי שוב על "גיבוי מוצפן ל-Drive".'; return;
  }
  const name = `logbook-${today()}.encrypted.txt`, body = await encrypt(JSON.stringify(entries), pw);
  const file = new File([body], name, {type:'text/plain'}); // .txt: the share sheet refuses .json
  try {
    if (navigator.canShare?.({files:[file]})) { await navigator.share({files:[file], title:'גיבוי פנקס פעולות'}); m.textContent = 'הקובץ המוצפן נשלח לאפליקציה שבחרת.'; }
    else { download(name, body, 'text/plain'); m.textContent = 'הדפדפן לא תומך בשיתוף. הקובץ המוצפן נשמר בהורדות, אפשר להעלות אותו ל-Drive ידנית.'; }
    localStorage.setItem(DRV, today()); render();
  } catch (e) { m.textContent = e.name === 'AbortError' ? 'השיתוף בוטל.' : 'השיתוף נכשל: ' + e.message; }
};
$('expCsv').onclick = () => {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['סעיף','פעולה','תפקיד','תאריך','שם המטופלת','ת"ז','רופא/ה בכיר/ה','כניסה לחדר ניתוח','התחלת ניתוח','הערה'],
    ...[...entries].sort((a, b) => a.cat.localeCompare(b.cat, undefined, {numeric:true}) || a.date.localeCompare(b.date))
      .map(e => [e.cat, CATS.find(c => c.id === e.cat)?.name, ROLE[e.role], heDate(e.date), e.patient, e.pid, e.attending, e.tIn, e.tStart, e.note])];
  download(`logbook-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv'); // BOM so Excel reads Hebrew
};
$('impBtn').onclick = () => $('impFile').click();
$('impFile').onchange = async ev => {
  try {
    let inc = JSON.parse(await ev.target.files[0].text());
    if (inc.logbook && inc.data) { // encrypted backup: try the saved password, then ask
      const saved = localStorage.getItem(PW);
      inc = JSON.parse(await decrypt(inc, saved).catch(() => decrypt(inc, prompt('סיסמת הגיבוי:') || '')));
    }
    if (!Array.isArray(inc) || inc.some(e => !e.id || !e.cat || !e.date)) throw 0;
    const have = new Set(entries.map(e => e.id)), add = inc.filter(e => !have.has(e.id)); // merge, never overwrite
    entries.push(...add);
    if (save()) { render(); $('msg').textContent = `שוחזרו ${add.length} פעולות.`; }
  } catch { $('msg').textContent = 'הקובץ אינו קובץ גיבוי תקין, או שהסיסמה שגויה.'; }
  ev.target.value = '';
};

// Sticker scan: OCR runs in the browser, the photo is never uploaded or stored.
const validId = id => { // Israeli ID check digit
  const d = id.padStart(9, '0'); if (!/^\d{9}$/.test(d)) return false;
  return [...d].reduce((s, c, i) => { const x = c * (i % 2 + 1); return s + (x > 9 ? x - 9 : x); }, 0) % 10 === 0;
};
function parseSticker(text) {
  // The ID is printed several times on a sticker: collect every read and prefer one whose check digit is valid.
  const ids = [...text.matchAll(/(?<!\d)(?:\d{7,8}\s*-\s*\d|\d{9})(?!\d)/g)].map(m => m[0].replace(/\D/g, ''));
  const pid = ids.find(validId) || ids[0] || '';
  // ponytail: only guesses a dropped FIRST digit; a dropped middle digit still needs the user's eyes.
  const lead = pid.length === 8 && !validId(pid) ? [...'123456789'].find(d => validId(d + pid)) : '';
  const name = text.match(/(?<![א-ת])שם\s*:?\s*([א-ת][א-ת'" \-]{2,})/);
  return {pid, lead: lead || '', name: name ? name[1].trim() : ''};
}
const OCR = 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
async function shrink(file) { // phone photos are 12MP; ~3000px keeps small print readable
  const bmp = await createImageBitmap(file), k = Math.min(1, 3000 / Math.max(bmp.width, bmp.height));
  const c = Object.assign(document.createElement('canvas'), {width: bmp.width * k, height: bmp.height * k});
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return c;
}
$('scanBtn').onclick = () => $('scanFile').click();
$('scanFile').onchange = async ev => {
  const file = ev.target.files[0], m = $('scanMsg'); ev.target.value = ''; if (!file) return;
  m.textContent = 'קוראת את המדבקה… (בפעם הראשונה זה לוקח קצת יותר)';
  try {
    if (!window.Tesseract) await new Promise((ok, no) => document.head.append(Object.assign(document.createElement('script'), {src: OCR, onload: ok, onerror: no})));
    const w = await Tesseract.createWorker(['heb', 'eng']);
    const {data} = await w.recognize(await shrink(file)); await w.terminate();
    const r = parseSticker(data.text);
    if (r.name) $('patient').value = r.name;
    if (r.pid) { $('pid').value = r.pid; $('more').open = true; }
    m.textContent = !r.name && !r.pid ? 'לא הצלחתי לקרוא את המדבקה. נסי צילום קרוב וישר יותר, או הקלידי.'
      : (!r.pid || validId(r.pid) ? '' : r.lead ? `שימי לב: נראה שחסרה ספרה בת"ז. אם חסרה הראשונה, לפי ספרת הביקורת היא ${r.lead}. `
        : 'שימי לב: ספרת הביקורת של הת"ז לא תקינה, כנראה ספרה נקראה לא נכון. ') + 'בדקי שהפרטים נכונים לפני השמירה.';
  } catch { m.textContent = 'הקריאה נכשלה (בשימוש הראשון נדרש חיבור לאינטרנט). אפשר להקליד ידנית.'; }
};

// Self-check: open the page with #test
if (location.hash === '#test') {
  const p = parseSticker('| מז 03964875-4שם ישראלה ישראלי +\nאב 03964875-3 טל 054-1234567'), q = parseSticker('מז:3964875-3');
  console.assert(p.pid === '039648753' && p.name === 'ישראלה ישראלי' && !validId('039648754'), 'sticker parse broken');
  console.assert(q.pid === '39648753' && validId(q.pid) && parseSticker('מ.ז 2345678-2').lead === '1' && validId('123456782'), 'id repair broken');
  encrypt('שלום', 'pw123456').then(async c => {
    const ok = await decrypt(JSON.parse(c), 'pw123456') === 'שלום', bad = await decrypt(JSON.parse(c), 'wrong').then(() => true, () => false);
    console.assert(ok && !bad && !c.includes('שלום'), 'encryption broken'); console.log('crypto check done');
  });
  console.log('self-check done');
}
render();
</script>
